[project]
name = "wse"
version = "0.1.0"
description = "Weight-space engineering: inspect, edit, and evaluate neural network weights through shared contracts"
requires-python = ">=3.11"
dependencies = [
    "mcp==2.3.0",
    "numpy>=2.0",
    "pydantic>=2.12",
    "safetensors>=0.8",
    "torch>=2.9",
]

[project.optional-dependencies]
agents-openai = ["openai-agents>=0.24"]
models-hf = ["transformers>=5.22.2", "math-verify>=0.9"]

[project.scripts]
wse = "wse.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
