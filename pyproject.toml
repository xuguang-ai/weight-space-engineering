[project]
name = "wse"
version = "0.1.2"
description = "Weight-space engineering: agent-first, reproducible experiments that edit neural network weights directly"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Xuguang Ai" }]
requires-python = ">=3.11"
keywords = ["weight editing", "model editing", "interpretability", "llm agents", "mcp", "reproducibility", "pytorch",
            "transformers"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "mcp==2.3.0",
    "numpy>=2.0",
    "pydantic>=2.12",
    "safetensors>=0.8",
    "torch>=2.9",
    "typing-extensions>=4.6",
]

[project.optional-dependencies]
agents-openai = ["openai-agents>=0.24"]
models-hf = ["transformers>=5.22.2", "math-verify>=0.9"]

[project.scripts]
wse = "wse.cli:main"

[project.urls]
Homepage = "https://github.com/xuguang-ai/weight-space-engineering"
Documentation = "https://github.com/xuguang-ai/weight-space-engineering/tree/main/docs"
Repository = "https://github.com/xuguang-ai/weight-space-engineering"
Issues = "https://github.com/xuguang-ai/weight-space-engineering/issues"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wse"]

[tool.hatch.build.targets.sdist]
exclude = ["/dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
